<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Rust Client Release Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-0: #060606;
      --bg-1: #1b1b1e;
      --ink: #FAFAFA;
      --signal: #ff8c00;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-0);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      width: 2560px;
      height: 1440px;
      flex-shrink: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 1100px 850px at 50% 40%, rgba(255, 140, 0, 0.05), transparent 62%),
        linear-gradient(115deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 58%),
        radial-gradient(ellipse 1800px 1400px at 74% 18%, var(--bg-1) 0%, #060606 55%, #000000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wordmark {
      font-family: 'Michroma', sans-serif;
      font-size: 150px;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-transform: uppercase;
      white-space: nowrap;
      filter: drop-shadow(0 16px 40px rgba(0, 0, 0, 0.55));
    }

    .version-wrap {
      margin-top: 44px;
      max-width: 2200px;
      display: flex;
      justify-content: center;
    }
    .version {
      font-family: 'Michroma', sans-serif;
      font-size: 248px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-transform: uppercase;
      white-space: nowrap;
      filter: drop-shadow(0 24px 60px rgba(0, 0, 0, 0.6));
    }
    .version .v { color: var(--signal); }

    .cta {
      margin-top: 56px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.22em;
      color: var(--signal);
      text-transform: uppercase;
    }

    .faf-logo {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.7;
    }
    .faf-logo svg {
      width: 150px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="wordmark">Rust Client</div>

    <div class="version-wrap">
      <!-- Wird vom Worker per env.VERSION_PLACEHOLDER ersetzt (siehe index.js),
           per html.split(placeholder).join(version) -- global im gesamten
           Dateiinhalt. Dieser Platzhalter darf deshalb NIRGENDWO sonst in
           dieser Datei auftauchen, auch nicht als String-Literal in Skripten
           oder Kommentaren, sonst wird er dort mitersetzt. -->
      <div class="version" id="version">{{VERSION}}</div>
    </div>

    <div class="cta">New Release &#8599;</div>

    <div class="faf-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 374">
        <polygon fill="#8a8a8a" points="561.3 187.18 653.75 347.29 594.8 347.29 473.49 136.23 659.6 136.23 689 187.16 561.32 187.16 561.3 187.18"/>
        <polygon fill="#8a8a8a" points="410.52 26.71 596.34 26.71 628.74 82.81 442.76 82.81 410.52 26.71"/>
        <path fill="#8a8a8a" d="M354.05,26.71h-1.49L167.47,347.29h56.78l44-76.23H435.89l44,76.23h58.43ZM305.57,207.25l46.52-80.56,46.51,80.56Z"/>
        <polygon fill="#8a8a8a" points="74.26 82.81 106.66 26.71 295.93 26.71 263.53 82.81 74.26 82.81"/>
        <polygon fill="#8a8a8a" points="110.82 347.29 49.23 347.29 141.68 187.18 14 187.18 43.4 136.25 232.67 136.25 110.82 347.29"/>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      var el = document.getElementById('version');
      var raw = el.textContent.trim();

      // "v"-Präfix vereinheitlichen: funktioniert egal ob der Git-Tag
      // "v0.4.2" oder "0.4.2" heisst -- kein doppeltes "vv" moeglich.
      var number = /^v/i.test(raw) ? raw.slice(1) : raw;

      el.textContent = '';
      var vSpan = document.createElement('span');
      vSpan.className = 'v';
      vSpan.textContent = 'v';
      el.appendChild(vSpan);
      el.appendChild(document.createTextNode(number));

      // Overflow-Schutz für lange Semver-Strings.
      var maxWidth = 2200;
      var size = 248;
      while (el.scrollWidth > maxWidth && size > 90) {
        size -= 6;
        el.style.fontSize = size + 'px';
      }
    })();
  </script>
</body>
</html>
